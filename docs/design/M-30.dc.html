<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { f: '쉬운 순' };
  }
  renderVals() {
    const fs = ['쉬운 순', '가까운 순'];
    return {
      filters: fs.map((l) => {
        const on = this.state.f === l;
        return {
          label: l,
          pressed: on ? 'true' : 'false',
          bg: on ? '#1e1e1e' : '#f4f3ef',
          fg: on ? '#ffffff' : '#1e1e1e',
          pick: () => this.setState({ f: l })
        };
      })
    };
  }
}
</script>
