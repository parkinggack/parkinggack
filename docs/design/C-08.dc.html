<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>C-08 주차장 상세</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#f4f3ef}a:hover{color:#ffffff}
.hatch{background-color:#242423}
</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #1e1e1e; color: #f4f3ef; font-family: 'Noto Sans KR', system-ui, sans-serif; font-variant-numeric: tabular-nums">
  <div aria-hidden="true" style="height: 44px; box-sizing: border-box; padding: 0 64px; display: flex; align-items: center; border-bottom: 1px solid #3a3936; background: #161616; font-size: 14px; color: #b5b3ad">Pleos Connect 시스템 영역</div>

  <header style="height: 112px; box-sizing: border-box; padding: 0 32px; display: flex; align-items: center; gap: 20px; border-bottom: 1px solid #3a3936; background: #2a2a28">
    <a href="C-01.dc.html" aria-label="뒤로" style="width: 60px; height: 60px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 16px; border: 1.5px solid #8a8780; text-decoration: none">
      <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#f4f3ef" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-size: 28px; font-weight: 700">현대백화점 판교점 지하주차장</h1>
      <span style="font-size: 16px; color: #b5b3ad">최근 30일 · 차량 142대 기준</span>
    </div>
    <div style="display: flex; align-items: flex-end; gap: 12px; padding-right: 8px">
      <span style="font-size: 52px; font-weight: 700; line-height: 1; letter-spacing: -1px">★4.3</span>
      <div style="display: flex; flex-direction: column; gap: 4px; padding-bottom: 2px">
        <div aria-hidden="true" style="display: flex; align-items: flex-end; gap: 3px; height: 24px">
          <span style="display: block; width: 8px; height: 8px; border-radius: 2px; background: #f4f3ef"></span>
          <span style="display: block; width: 8px; height: 12px; border-radius: 2px; background: #f4f3ef"></span>
          <span style="display: block; width: 8px; height: 16px; border-radius: 2px; background: #f4f3ef"></span>
          <span style="display: block; width: 8px; height: 20px; border-radius: 2px; background: #f4f3ef"></span>
          <span style="display: block; width: 8px; height: 24px; border-radius: 2px; border: 1.5px solid #8a8780; box-sizing: border-box"></span>
        </div>
        <span style="font-size: 18px; font-weight: 700">어려움</span>
      </div>
    </div>
    <button type="button" style="height: 64px; padding: 0 22px; border-radius: 16px; border: 1.5px solid #8a8780; background: #2a2a28; color: #f4f3ef; font-family: inherit; font-size: 20px; font-weight: 500; cursor: pointer">별점 남기기</button>
    <a href="C-04a.dc.html" style="height: 64px; padding: 0 26px; display: flex; align-items: center; border-radius: 16px; background: #f4f3ef; color: #1e1e1e; font-size: 20px; font-weight: 700; text-decoration: none">경유지로 안내</a>
  </header>

  <div style="height: 563px; box-sizing: border-box; padding: 20px 32px 28px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px">

    <section style="box-sizing: border-box; padding: 22px; background: #2a2a28; border: 1.5px solid #3a3936; border-radius: 12px; display: flex; flex-direction: column; gap: 18px">
      <h2 style="margin: 0; font-size: 22px; font-weight: 700">왜 어려울까요</h2>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; align-items: baseline; justify-content: space-between"><span style="font-size: 18px; font-weight: 500">평균 후진</span><strong style="font-size: 24px">3.2회</strong></div>
        <div style="position: relative; height: 14px; border-radius: 7px; background: #4a4944">
          <div style="width: 64%; height: 14px; border-radius: 7px; background: #f4f3ef"></div>
          <span aria-hidden="true" style="position: absolute; left: 28%; top: -5px; width: 3px; height: 24px; background: #b5b3ad"></span>
        </div>
        <span style="font-size: 14px; color: #b5b3ad">세로선 = 전체 평균 1.4회</span>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; align-items: baseline; justify-content: space-between"><span style="font-size: 18px; font-weight: 500">램프 회전</span><strong style="font-size: 24px">2.5바퀴</strong></div>
        <div style="position: relative; height: 14px; border-radius: 7px; background: #4a4944">
          <div style="width: 62%; height: 14px; border-radius: 7px; background: #f4f3ef"></div>
          <span aria-hidden="true" style="position: absolute; left: 20%; top: -5px; width: 3px; height: 24px; background: #b5b3ad"></span>
        </div>
        <span style="font-size: 14px; color: #b5b3ad">전체 평균 0.8바퀴</span>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; align-items: baseline; justify-content: space-between"><span style="font-size: 18px; font-weight: 500">진입 → 주차</span><strong style="font-size: 24px">2분 10초</strong></div>
        <div style="position: relative; height: 14px; border-radius: 7px; background: #4a4944">
          <div style="width: 65%; height: 14px; border-radius: 7px; background: #f4f3ef"></div>
          <span aria-hidden="true" style="position: absolute; left: 32%; top: -5px; width: 3px; height: 24px; background: #b5b3ad"></span>
        </div>
        <span style="font-size: 14px; color: #b5b3ad">전체 평균 1분 05초</span>
      </div>

      <div style="flex-grow: 1"></div>
      <div style="padding: 14px 16px; border-radius: 12px; background: #1e1e1e; font-size: 18px; font-weight: 700">나는 여기서 평균 후진 2회</div>
    </section>

    <section style="box-sizing: border-box; padding: 22px; background: #2a2a28; border: 1.5px solid #3a3936; border-radius: 12px; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <h2 style="margin: 0; font-size: 22px; font-weight: 700">층별 혼잡</h2>
        <span style="font-size: 15px; color: #b5b3ad">평일 오후</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 14px">
        <sc-for list="{{floors}}" as="f" hint-placeholder-count="5">
          <div style="display: flex; align-items: center; gap: 12px">
            <span style="width: 44px; font-size: 22px; font-weight: 700">{{f.name}}</span>
            <div style="flex-grow: 1; height: 28px; border-radius: 6px; background: #4a4944; overflow: hidden">
              <div style="width: {{f.pct}}; height: 28px; background: {{f.fill}}"></div>
            </div>
            <span style="width: 44px; text-align: right; font-size: 17px; font-weight: 700">{{f.label}}</span>
          </div>
        </sc-for>
      </div>
      <div style="flex-grow: 1"></div>
      <div style="padding: 14px 16px; border-radius: 12px; background: #1e1e1e; font-size: 18px; font-weight: 700">B1 만차 · B3부터 여유</div>
    </section>

    <section style="box-sizing: border-box; padding: 22px; background: #2a2a28; border: 1.5px solid #3a3936; border-radius: 12px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <h2 style="margin: 0; font-size: 22px; font-weight: 700">시간대별</h2>
        <span style="font-size: 15px; color: #b5b3ad">진할수록 붐빔</span>
      </div>
      <div role="img" aria-label="요일·시간대별 혼잡. 금요일 저녁과 주말 낮이 가장 붐빔" style="display: flex; flex-direction: column; gap: 6px">
        <div aria-hidden="true" style="display: flex; gap: 6px; padding-left: 34px">
          <sc-for list="{{hours}}" as="h" hint-placeholder-count="7">
            <span style="width: 36px; text-align: center; font-size: 14px; color: #b5b3ad">{{h}}</span>
          </sc-for>
        </div>
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
          <div aria-hidden="true" style="display: flex; align-items: center; gap: 6px">
            <span style="width: 28px; font-size: 15px; font-weight: 500; color: #b5b3ad">{{r.day}}</span>
            <sc-for list="{{r.cells}}" as="c" hint-placeholder-count="7">
              <span style="display: block; width: 36px; height: 30px; box-sizing: border-box; border-radius: 5px; border: 1px solid #3a3936; background: {{c.bg}}"></span>
            </sc-for>
          </div>
        </sc-for>
      </div>
      <div style="flex-grow: 1"></div>
      <div aria-hidden="true" style="display: flex; align-items: center; gap: 6px; font-size: 14px; color: #b5b3ad">
        <span>한산</span>
        <span style="display: block; width: 22px; height: 14px; border-radius: 3px; border: 1px solid #3a3936; background: #2a2a28"></span>
        <span style="display: block; width: 22px; height: 14px; border-radius: 3px; background: #3e3d3a"></span>
        <span style="display: block; width: 22px; height: 14px; border-radius: 3px; background: #6b6964"></span>
        <span style="display: block; width: 22px; height: 14px; border-radius: 3px; background: #b5b3ad"></span>
        <span style="display: block; width: 22px; height: 14px; border-radius: 3px; background: #f4f3ef"></span>
        <span>붐빔</span>
      </div>
    </section>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const shades = ['#2a2a28', '#3e3d3a', '#6b6964', '#b5b3ad', '#f4f3ef'];
    const days = ['월', '화', '수', '목', '금', '토', '일'];
    const grid = [
      [0, 1, 2, 2, 3, 2, 1],
      [0, 1, 2, 2, 3, 2, 1],
      [0, 1, 2, 3, 3, 2, 1],
      [0, 1, 2, 3, 3, 3, 1],
      [0, 1, 2, 3, 4, 4, 2],
      [1, 2, 4, 4, 4, 3, 2],
      [1, 2, 4, 4, 3, 2, 1]
    ];
    const floorData = [
      { name: 'B1', v: 100, label: '만차' },
      { name: 'B2', v: 85, label: '붐빔' },
      { name: 'B3', v: 55, label: '여유' },
      { name: 'B4', v: 30, label: '여유' },
      { name: 'B5', v: 15, label: '여유' }
    ];
    return {
      hours: ['8시', '10', '12', '14', '16', '18', '20'],
      rows: days.map((d, i) => ({ day: d, cells: grid[i].map((lv) => ({ bg: shades[lv] })) })),
      floors: floorData.map((f) => ({
        name: f.name,
        label: f.label,
        pct: f.v + '%',
        fill: f.v >= 80 ? '#f4f3ef' : '#8a8780'
      }))
    };
  }
}
</script>
</body>
</html>
